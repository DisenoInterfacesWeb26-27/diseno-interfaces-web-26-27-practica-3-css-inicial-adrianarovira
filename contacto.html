        <section class="secContacto">

            <div>
                <h1>Contacta con nosotros</h1>

                <form action="#" method="post">

                    <div class="campo">
                        <label for="Nombre">Nombre:</label>
                        <input type="text" id="Nombre" name="nombre" maxlength="40" placeholder="Introduce tu nombre" 
                        pattern="[A-Za-z0-9]+" required autofocus>
                    </div>

                    <div class="campo">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
                    </div>

                    <div class="campo">
                        <label for="edad">Edad:</label>
                        <input type="number" id="edad" name="edad" min="18" max="99" placeholder="Introduce tu edad" required>
                    </div>

                    <div class="campo">
                        <label for="tel">Teléfono:</label>
                        <input type="tel" id="tel" name="telefono" placeholder="Introduce tu teléfono" required>
                    </div>

                    <div class="campo">
                        <label for="consulta">Consulta:</label>
                        <textarea id="consulta"  name="consulta" placeholder="Escribe aquí tu consulta" required></textarea>
                    </div>

                    <div class="privacidad">

                        <input type="checkbox" id="privacidad" name="privacidad" required>
                        
                        <label for="privacidad">
                        Acepto la política de privacidad y cookies
                        </label>

                    
                    </div>      
                
                 <button type="submit">Enviar</button>
            
           
                </form>

               

            </div>
          </section>
